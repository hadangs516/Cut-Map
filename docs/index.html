<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>컷맵 대학맵</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#16202B;--muted:#5B6877;--line:#D9E0E8;
  --accent:#2A55C9;--accent-bg:#E6ECFB;--warn-bg:#FFF4D6;--warn-ink:#6B4A00;
  --sea:#CFDDEA;--land:#F9FAFB;--land-metro:#FFFFFF;--prov-line:#AEBBCB;--gu-line:#D3DBE4;--map-label:#6F7E8F;
  --c-it:#2A55C9;--c-none:#7A8593;--c-unk:#E08A00;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F171F;--surface:#141D27;--ink:#E7EDF3;--muted:#9AA8B6;--line:#2A3745;
    --accent:#86A6FF;--accent-bg:#1B2742;--warn-bg:#3A2F10;--warn-ink:#F2D68A;
    --sea:#0A1722;--land:#17202A;--land-metro:#1B2530;--prov-line:#3A4855;--gu-line:#29343F;--map-label:#72808F;
    --c-it:#86A6FF;--c-none:#9AA5B1;--c-unk:#FFB033;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{padding:10px 16px 8px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;font-weight:700;line-height:1.3}
#prov{margin:6px 0 0;padding:6px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px;line-height:1.4}
#prov[hidden]{display:none}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
#count{margin-top:6px;font-size:12.5px;color:var(--muted)}
main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--sea);font-family:var(--font)}
.maperr{padding:24px 16px;color:var(--ink)}

/* base map (GeoJSON) */
.leaflet-pane path.prov{fill:var(--land);stroke:var(--prov-line);stroke-width:1px;stroke-linejoin:round}
.leaflet-pane path.prov.metro{fill:var(--land-metro)}
.leaflet-pane path.gu{fill:none;stroke:var(--gu-line);stroke-width:.8px}
.rl span{display:block;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;color:var(--map-label);text-shadow:0 0 3px var(--land)}
.rl.city span{font-size:11px}
.leaflet-bar a{background:var(--surface)!important;color:var(--ink)!important;border-bottom-color:var(--line)!important}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}

/* marker shapes: 있음=채운 원, 없음=속 빈 사각, 판정불가=주황 마름모+? */
.mk{display:block;width:16px;height:16px;transform:translate(-50%,-50%)}
.mk svg{display:block;width:16px;height:16px;overflow:visible}
.mk.it svg circle{fill:var(--c-it);stroke:var(--surface);stroke-width:1.5}
.mk.none svg rect{fill:var(--surface);stroke:var(--c-none);stroke-width:2}
.mk.unk svg path{fill:var(--c-unk);stroke:var(--surface);stroke-width:1.5;stroke-linejoin:round}
.mk.unk svg text{fill:#fff;font:700 9px var(--font);text-anchor:middle}
.chip .sw{display:inline-block;width:14px;height:14px}
.chip .sw svg{display:block;width:14px;height:14px}

/* popup */
.pu{min-width:180px;font-size:13.5px;line-height:1.5}
.pu h2{margin:0 0 4px;font-size:15px;font-weight:700}
.pu dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.pu dt{color:var(--muted)}
.pu dd{margin:0}
.pu .msg{margin:6px 0 0;padding-top:6px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>컷맵 대학맵</h1>
  <p id="prov" hidden>IT 유무는 잠정값입니다</p>
  <div id="chips" role="group" aria-label="마커 상태 필터"></div>
  <div id="count" aria-live="polite"></div>
</header>
<main><div id="map"></div></main>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
(function(){
'use strict';

/* 화면이 읽는 필드: univ(학교명), campus, region, lat, lon, itStatus, itStatusProvisional */
var STATUS = [
  {key:'IT있음', label:'IT있음-입결없음', cls:'it',   on:true,
   msg:''},
  {key:'IT없음', label:'IT없음',           cls:'none', on:false,
   msg:'IT계열 학과가 없습니다'},
  {key:'판정불가', label:'판정불가',       cls:'unk',  on:true,
   msg:'IT 학과 유무를 판정하지 못했습니다(자료 확인 필요)'}
];
var BYKEY = {};
STATUS.forEach(function(s){ BYKEY[s.key] = s; });

var LABELS = [
  ['경기',37.78,127.36,'prov'],['강원',37.75,128.35,'prov'],['충북',36.80,127.75,'prov'],['충남',36.50,126.85,'prov'],
  ['전북',35.72,127.15,'prov'],['전남',34.92,126.95,'prov'],['경북',36.35,128.80,'prov'],['경남',35.30,128.25,'prov'],
  ['제주',33.38,126.55,'prov'],['서울',37.66,126.93,'prov'],['인천',37.45,126.52,'prov'],
  ['대전',36.35,127.39,'city'],['대구',35.87,128.60,'city'],['광주',35.16,126.85,'city'],['부산',35.18,129.07,'city'],['울산',35.55,129.31,'city'],['세종',36.56,127.26,'city']
];
var METRO = {'서울특별시':1, '경기도':1, '인천광역시':1};

var $ = function(s){ return document.querySelector(s); };
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function getJSON(url){
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error(url + ' ' + r.status);
    return r.json();
  });
}
function shapeSVG(cls){
  if(cls === 'it')   return '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/></svg>';
  if(cls === 'none') return '<svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>';
  return '<svg viewBox="0 0 16 16"><path d="M8 0.8 L15.2 8 L8 15.2 L0.8 8 Z"/><text x="8" y="11.2">?</text></svg>';
}

var map, layers = {}, counts = {}, total = 0, active = {};
STATUS.forEach(function(s){ active[s.key] = s.on; layers[s.key] = L.layerGroup(); counts[s.key] = 0; });

function popupNode(m, st){
  var box = el('div', 'pu');
  box.appendChild(el('h2', '', m.univ));
  var dl = el('dl');
  [['캠퍼스', m.campus], ['지역', m.region], ['상태', st.label]].forEach(function(r){
    dl.appendChild(el('dt', '', r[0]));
    dl.appendChild(el('dd', '', r[1]));
  });
  box.appendChild(dl);
  if(st.msg) box.appendChild(el('p', 'msg', st.msg));
  return box;
}

function addMarker(m, st){
  var icon = L.divIcon({className:'', iconSize:[0,0],
    html:'<span class="mk ' + st.cls + '">' + shapeSVG(st.cls) + '</span>'});
  var mk = L.marker([m.lat, m.lon], {icon:icon, title:m.campus, keyboard:true, riseOnHover:true});
  mk.bindPopup(function(){ return popupNode(m, st); });
  layers[st.key].addLayer(mk);
}

function updateCount(){
  var shown = 0;
  STATUS.forEach(function(s){ if(active[s.key]) shown += counts[s.key]; });
  $('#count').textContent = '표시 ' + shown + '개 / 전체 ' + total + '개';
}

function buildChips(){
  var box = $('#chips');
  STATUS.forEach(function(s){
    var b = el('button', 'chip');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(active[s.key]));
    var sw = el('span', 'sw');
    sw.innerHTML = '<span class="mk ' + s.cls + '" style="transform:none;width:14px;height:14px">' + shapeSVG(s.cls) + '</span>';
    b.appendChild(sw);
    b.appendChild(document.createTextNode(s.label));
    b.appendChild(el('span', 'n', String(counts[s.key])));
    b.addEventListener('click', function(){
      active[s.key] = !active[s.key];
      b.setAttribute('aria-pressed', String(active[s.key]));
      if(active[s.key]) layers[s.key].addTo(map); else map.removeLayer(layers[s.key]);
      updateCount();
    });
    box.appendChild(b);
  });
}

function initMap(prov, seoul){
  map = L.map('map', {
    zoomControl:false, attributionControl:false, minZoom:6, maxZoom:15,
    zoomSnap:0.25, zoomDelta:0.5,
    maxBounds:[[32.6,123.8],[39.0,132.4]], maxBoundsViscosity:0.8
  });
  L.control.zoom({position:'topright', zoomInTitle:'확대', zoomOutTitle:'축소'}).addTo(map);
  map.createPane('labels');
  map.getPane('labels').style.zIndex = 450;
  map.getPane('labels').style.pointerEvents = 'none';
  var renderer = L.svg({padding:0.6});
  L.geoJSON(prov, {renderer:renderer, interactive:false, style:function(f){
    return {className:'prov' + (METRO[f.properties.n] ? ' metro' : ''), weight:1, fillOpacity:1};
  }}).addTo(map);
  L.geoJSON(seoul, {renderer:renderer, interactive:false, style:function(){
    return {className:'gu', weight:.8, fill:false};
  }}).addTo(map);
  LABELS.forEach(function(l){
    L.marker([l[1], l[2]], {pane:'labels', interactive:false, keyboard:false,
      icon:L.divIcon({className:'rl ' + l[3], html:'<span>' + l[0] + '</span>', iconSize:[0,0]})}).addTo(map);
  });
  map.setView([36.4, 127.9], 7);
}

function fail(msg){
  var m = $('#map');
  m.innerHTML = '';
  m.appendChild(el('div', 'maperr', msg));
}

if(!window.L){ fail('지도 라이브러리를 불러오지 못했습니다.'); return; }

Promise.all([getJSON('data/markers.json'), getJSON('data/geo_prov.json'), getJSON('data/geo_seoul.json')])
.then(function(res){
  var markers = res[0].markers;
  initMap(res[1], res[2]);
  var unknown = 0, provisional = false;
  markers.forEach(function(m){
    var st = BYKEY[m.itStatus];
    total++;
    if(m.itStatusProvisional === true) provisional = true;
    if(!st){ unknown++; return; }
    counts[st.key]++;
    addMarker(m, st);
  });
  if(unknown) console.warn('알 수 없는 itStatus 값을 가진 마커 ' + unknown + '개는 표시하지 않았습니다.');
  STATUS.forEach(function(s){ if(active[s.key]) layers[s.key].addTo(map); });
  $('#prov').hidden = !provisional;
  buildChips();
  updateCount();
  window.__cutmap = {total:total, counts:counts, unknown:unknown};
})
.catch(function(e){
  console.error(e);
  fail('데이터를 불러오지 못했습니다. 파일 서버(http)로 열어야 합니다. (' + e.message + ')');
});
})();
</script>
</body>
</html>
