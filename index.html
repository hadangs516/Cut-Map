/* ---------- ranking ---------- */
/* ---------- 지도 · 목록 탭 (정렬·필터·별표) ----------
   SPEC_대학맵.md 3-1(정렬 8가지), 3-2(분야), 3-3(필터).
   분야 버튼은 하드코딩하지 않고 지금 들어 있는 데이터에서 만든다. */

var SORTS = [
  {id:'near',    name:'내 성적과 가까운 순'},
  {id:'cutHigh', name:'합격선 높은 순'},
  {id:'cutLow',  name:'합격선 낮은 순'},
  {id:'compHigh',name:'경쟁률 높은 순'},
  {id:'compLow', name:'경쟁률 낮은 순'},
  {id:'n',       name:'모집인원 많은 순'},
  {id:'add',     name:'추합 많은 순'},
  {id:'name',    name:'대학명 가나다순'}
];

/* 데이터에 실제로 있는 분야만 버튼으로 만든다. */
function fieldOptions(){
  var groups = {}, subs = {};
  UNIS.forEach(function(u){
    u.ds.forEach(function(d){
      var g = FIELD_GROUP[d.f];
      if(g) groups[g] = (groups[g] || 0) + 1;
      if(d.f) subs[d.f] = (subs[d.f] || 0) + 1;
    });
  });
  var GNAME = {csw:'컴퓨터·SW', aid:'AI·데이터'};
  var out = [['all', '전체 분야']];
  Object.keys(groups).forEach(function(g){ out.push([g, GNAME[g] || g]); });
  return out;
}
function regionOptions(){
  var seen = {};
  UNIS.forEach(function(u){ seen[u.rg] = 1; });
  var out = [['all', '전체 지역']];
  if(seen['서울']) out.push(['seoul', '서울']);
  if(Object.keys(seen).some(function(k){ return k !== '서울'; })) out.push(['metro', '서울 밖']);
  return out;
}
function ownerOptions(){
  var seen = {};
  UNIS.forEach(function(u){ if(u.ty) seen[u.ty] = 1; });
  var out = [['all', '국공립·사립']];
  if(seen['국립'] || seen['공립']) out.push(['pub', '국공립']);
  if(seen['사립']) out.push(['pri', '사립']);
  return out;
}
function segs(){
  return [
    ['sort', SORTS.map(function(s){ return [s.id, s.name]; })],
    ['cls', [['all','전체'],['reach','상향'],['fit','적정'],['safe','안정']]],
    ['region', regionOptions()],
    ['owner', ownerOptions()],
    ['field', fieldOptions()]
  ];
}
/* 분야 기본값은 내 희망 학과의 분야. 없으면 전체. (SPEC 3-2) */
function defaultField(){
  var s = (typeof targetSeries === 'function') ? targetSeries() : [];
  if(!s.length) return 'all';
  if(s.indexOf('공학') >= 0) return 'csw';
  return 'all';
}
function renderFilters(){
  if(state.rank.sort === 'cut') state.rank.sort = hasG() ? 'near' : 'name';
  if(state.rank.field == null) state.rank.field = defaultField();
  var h = segs().map(function(s){
    return '<div class="seg" role="group" data-seg="' + s[0] + '">' + s[1].map(function(o){
      return '<button type="button" data-v="' + o[0] + '" aria-pressed="' + (state.rank[s[0]] === o[0]) + '">' + esc(o[1]) + '</button>';
    }).join('') + '</div>';
  }).join('');
  h += '<div class="tgs"><label><input type="checkbox" id="tgWomen"' + (state.women ? ' checked' : '') + '> 여대 포함</label>' +
    '<label><input type="checkbox" id="tgOut"' + (state.rank.out ? ' checked' : '') + '> 범위 밖 학과도 보기</label>' +
    '<label><input type="checkbox" id="tgStar"' + (state.rank.star ? ' checked' : '') + '> 목표만 보기</label></div>';
  $('#filters').innerHTML = h;
}

function starOnly(u, d){
  if(!state.rank.star) return true;
  if(typeof isStarUniv !== 'function') return true;
  return isStarUniv(u.nm) || isStarMajor(majorId(u.nm, d.nm));
}
function renderRank(){
  var R = state.rank, items = [];
  UNIS.forEach(function(u){
    if(!state.women && u.w) return;
    if(R.region === 'seoul' && u.rg !== '서울') return;
    if(R.region === 'metro' && u.rg === '서울') return;
    if(R.owner === 'pub' && !(u.ty === '국립' || u.ty === '공립')) return;
    if(R.owner === 'pri' && u.ty !== '사립') return;
    u.ds.forEach(function(d){
      var r = curRow(d);
      if(!r) return;
      if(R.field !== 'all' && FIELD_GROUP[d.f] !== R.field) return;
      if(!starOnly(u, d)) return;
      var e = evalDept(d);
      var inr = !!IN[e.cls];
      if(!inr && !R.out) return;
      if(R.cls !== 'all' && e.cls !== R.cls) return;
      items.push({u:u, d:d, r:r, e:e, inr:inr});
    });
  });

  /* 정렬 기준 값이 없는 항목은 항상 맨 아래. (SPEC 3-1) */
  function val(it){
    var r = it.r;
    switch(R.sort){
      case 'near':     return hasG() ? Math.abs(r.cut - state.G) : null;
      case 'cutHigh':  return num(r.cut) ? r.cut : null;
      case 'cutLow':   return num(r.cut) ? -r.cut : null;
      case 'compHigh': return num(r.comp) ? -r.comp : null;
      case 'compLow':  return num(r.comp) ? r.comp : null;
      case 'n':        return num(r.n) ? -r.n : null;
      case 'add':      return num(r.add) ? -r.add : null;
      default:         return null;
    }
  }
  items.forEach(function(it){ it._v = val(it); });
  items.sort(function(a, b){
    if(R.sort === 'name'){
      if(a.u.nm !== b.u.nm) return a.u.nm < b.u.nm ? -1 : 1;
      return a.d.nm < b.d.nm ? -1 : 1;
    }
    var av = a._v, bv = b._v;
    if(av == null && bv == null) return a.u.nm < b.u.nm ? -1 : 1;
    if(av == null) return 1;
    if(bv == null) return -1;
    if(av !== bv) return av - bv;
    return a.u.nm < b.u.nm ? -1 : 1;
  });

  var sortName = (SORTS.filter(function(s){ return s.id === R.sort; })[0] || {}).name || '';
  $('#rcount').textContent = items.length + '개 학과 · ' + sortName +
    ' · 내 기준 ' + displayBasis().txt + ' (' + scaleUnit() + ')';
  if(!items.length){
    $('#rankList').innerHTML = '<li class="empty">조건에 맞는 학과가 없어요. 필터를 넓혀 보세요.</li>';
    return;
  }
  $('#rankList').innerHTML = items.map(function(it, i){
    var r = it.r, meta = '<span>' + esc(r.t) + '</span><span>' + (r.cy || '') + '학년도</span>';
    if(R.sort === 'compHigh' || R.sort === 'compLow') meta += '<span>경쟁률 ' + fcomp(r.comp) + '</span>';
    if(R.sort === 'n') meta += '<span>모집 ' + (num(r.n) ? r.n + '명' : '자료 없음') + '</span>';
    if(R.sort === 'add') meta += '<span>추합 ' + (num(r.add) ? r.add + '명' : '자료 없음') + '</span>';
    if(it._v == null && R.sort !== 'name') meta += '<span>자료 없음</span>';
    if(r.cy === 2024) meta += '<span class="mk">2024 자료</span>';
    if(it.e.flags.length) meta += '<span class="mk">보정됨</span>';
    var mid = (typeof majorId === 'function') ? majorId(it.u.nm, it.d.nm) : '';
    var starred = (typeof isStarMajor === 'function') && isStarMajor(mid);
    return '<li><div class="rrow-wrap"><button type="button" class="rrow' + (it.inr ? '' : ' oor') + '" data-go="' + it.d.id + '">' +
      '<span class="rn">' + (i + 1) + '</span>' +
      '<span class="rm"><span class="ru">' + esc(it.u.sh) + '</span><span class="rd">' + esc(it.d.nm) + '</span><span class="rt">' + meta + '</span></span>' +
      '<span class="rc"><span class="rv">' + showGrade(r.cut) + '</span><span class="badge c-' + it.e.cls + '">' + CLS_NAME[it.e.cls] + '</span></span>' +
      '</button><button type="button" class="rstar' + (starred ? ' on' : '') + '" data-star="' + esc(mid) + '" aria-label="목표에 넣기">' +
      (starred ? '★' : '☆') + '</button></div></li>';
  }).join('');
}

function goToDept(id){
  var d = DMAP[id]; if(!d) return;
  var u = d.u, ev = evalUni(u);
  var showable = uniVisible(u, ev) && (state.women || !u.w);
  setView('map');
  selectUni(u, {dept:id, zoom:11.5, temp:!showable});
}

}

/* ---------- views ---------- */
function setView(v){
  state.view = v;
  document.querySelectorAll('.views button').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-view') === v ? 'true' : 'false'); });
  ['map','rank','info'].forEach(function(k){ $('#view-' + k).hidden = (k !== v); });
  if(v !== 'map' && state.sheetMode && state.sheetMode !== 'grade') closeSheet();
  if(v === 'map' && map){ map.invalidateSize(); layoutMarkers(); }
  if(v === 'rank'){ renderFilters(); renderRank(); }
}

/* ---------- events ---------- */
document.querySelector('.views').addEventListener('click', function(e){
  var b = e.target.closest('button[data-view]'); if(b) setView(b.getAttribute('data-view'));
});
$('#meBtn').addEventListener('click', function(){
  if(state.sheetMode === 'grade'){ closeSheet(); return; }
  state.selU = null; state.tempU = null; refreshMarkers();
  openSheet(renderGrade(), 'grade');
});
$('#legend').addEventListener('click', function(e){
  var c = e.target.closest('[data-cls]');
  if(c){ var k = c.getAttribute('data-cls'); state.cls[k] = !state.cls[k]; refreshMarkers(); return; }
  if(e.target.closest('[data-women]')){ state.women = !state.women; store.set('itmap.women', state.women); refreshMarkers(); }
});
sheet.addEventListener('click', function(e){
  var t;
  if(e.target.closest('[data-close]')){ closeSheet(); return; }
  if(e.target.closest('[data-grab]')){ sheet.classList.toggle('full'); return; }
  if((t = e.target.closest('[data-dept]'))){
    var d = DMAP[t.getAttribute('data-dept')];
    state.curDept = d; state.curTab = 'sum';
    openSheet(renderDept(d, 'sum'), 'dept');
    return;
  }
  if(e.target.closest('[data-back]')){
    var u = state.curDept ? state.curDept.u : state.selU;
    var from = state.curDept ? state.curDept.id : null;
    state.curDept = null;
    if(u){ openSheet(renderUni(u, from), 'uni'); var f = sbody.querySelector('.drow.focus'); if(f) f.scrollIntoView({block:'nearest'}); }
    return;
  }
  if((t = e.target.closest('[data-tab]'))){
    var id = t.getAttribute('data-tab');
    state.curTab = id;
    sbody.querySelectorAll('[data-tab]').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-tab') === id ? 'true' : 'false'); });
    sbody.querySelectorAll('[data-panel]').forEach(function(p){ p.hidden = p.getAttribute('data-panel') !== id; });
    return;
  }
  if(basisClick(e)) return;      /* "내 기준" 패널 동작은 map/50_basis.js */
});
sheet.addEventListener('input', function(e){ basisInput(e); });
sheet.addEventListener('change', function(e){ basisChange(e); });
$('#filters').addEventListener('click', function(e){
  var b = e.target.closest('.seg button'); if(!b) return;
  var seg = b.parentNode.getAttribute('data-seg');
  state.rank[seg] = b.getAttribute('data-v');
  renderFilters(); renderRank();
});
$('#filters').addEventListener('change', function(e){
  if(e.target.id === 'tgWomen'){ state.women = e.target.checked; store.set('itmap.women', state.women); refreshMarkers(); renderRank(); }
  if(e.target.id === 'tgOut'){ state.rank.out = e.target.checked; renderRank(); }
  if(e.target.id === 'tgStar'){ state.rank.star = e.target.checked; renderRank(); }
});
$('#rankList').addEventListener('click', function(e){
  var s = e.target.closest('[data-star]');
  if(s){ toggleStarMajor(s.getAttribute('data-star')); renderRank(); return; }
  var b = e.target.closest('[data-go]'); if(b) goToDept(b.getAttribute('data-go'));
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });
(function(){
  var g = $('#grab'), y0 = null;
  g.addEventListener('touchstart', function(e){ y0 = e.touches[0].clientY; }, {passive:true});
  g.addEventListener('touchend', function(e){
    if(y0 == null) return;
    var dy = e.changedTouches[0].clientY - y0; y0 = null;
    if(dy > 50){ if(sheet.classList.contains('full')) sheet.classList.remove('full'); else closeSheet(); }
    else if(dy < -40){ sheet.classList.add('full'); }
  }, {passive:true});
})();
window.addEventListener('resize', function(){ if(map){ map.invalidateSize(); layoutMarkers(); } });

];
function semLabel(id){ var p = String(id).split('-'); return p[0] + '학년 ' + p[1] + '학기'; }
function gradeTermLabel(g, t){ return g === 'grad' ? '졸업·N수' : (g + '학년 ' + t + '학기'); }

/* 학년도는 3월 1일에 시작한다. 3~12월은 그 해, 1~2월은 전년도. (SPEC 2-0) */
function schoolYearOf(d){ return (d.getMonth() + 1) >= 3 ? d.getFullYear() : d.getFullYear() - 1; }
/* 학기 기준일은 8월 1일. 3~7월 1학기, 8~12월 2학기, 1~2월은 지난 학년도의 2학기. */
function expectedTerm(d){
  var m = d.getMonth() + 1;
  return {schoolYear: schoolYearOf(d), term: (m >= 3 && m <= 7) ? 1 : 2};
}
function termIndex(schoolYear, term){ return schoolYear * 2 + (term - 1); }
/* 저장된 학년·학기에서 steps 학기만큼 진행한 값. 3학년 2학기를 넘으면 졸업·N수. */
function advanceTerm(grade, term, steps){
  var g = grade, t = term;
  for(var i = 0; i < steps; i++){
    if(g === 'grad') break;
    if(t === 1){ t = 2; } else { t = 1; g = g + 1; }
    if(g > 3){ g = 'grad'; t = 2; break; }
  }
  return {grade:g, term:t};
}

/* ----- 저장 (SPEC 5장 구조) ----- */
var USER_KEY = 'cutmap.user', USER_SCHEMA = 1;
var user = (function(){
  var u = store.get(USER_KEY, null);
  if(!u || typeof u !== 'object' || Array.isArray(u)) u = {};
  if(!u.profile || typeof u.profile !== 'object') u.profile = {};
  if(!Array.isArray(u.semesters)) u.semesters = [];
  if(!Array.isArray(u.exams)) u.exams = [];
  if(!Array.isArray(u.schedule)) u.schedule = [];
  if(!u.targets || typeof u.targets !== 'object') u.targets = {};
  if(!u.backup || typeof u.backup !== 'object') u.backup = {};
  u.v = USER_SCHEMA;
  return u;
})();
function saveUser(){ store.set(USER_KEY, user); }
function hasProfile(){ return !!user.profile && user.profile.currentGrade != null; }
function currentSemId(){
  var p = user.profile;
  if(!p || p.currentGrade == null || p.currentGrade === 'grad') return null;
  return p.currentGrade + '-' + p.currentTerm;
}
function setProfile(grade, term, opts){
  var exp = expectedTerm(new Date());
  var p = user.profile;
  p.currentGrade = grade;
  p.currentTerm = term;
  p.schoolYear = exp.schoolYear;
  /* 직접 고른 값이 예상 학기와 다를 수 있다. 바로 다시 묻지 않도록 이번 예상 학기는 넘긴 것으로 둔다. */
  if(!opts || opts.dismiss !== false) p.dismissedTermIndex = termIndex(exp.schoolYear, exp.term);
  saveUser();
}
function findSem(id){
  for(var i = 0; i < user.semesters.length; i++){ if(user.semesters[i].id === id) return user.semesters[i]; }
  return null;
}
function semCourses(id){ var s = findSem(id); return (s && Array.isArray(s.courses)) ? s.courses : []; }
function ensureSem(id){
  var s = findSem(id);
  if(!s){ s = {id:id, courses:[]}; user.semesters.push(s); }
  if(!Array.isArray(s.courses)) s.courses = [];
  return s;
}
/* 과목 마스터가 실제 데이터로 교체되면 courseCode가 안 맞을 수 있어서 이름을 같이 저장해 둔다. */
function courseName(c){
  if(c.customName) return c.customName;
  var m = CM_BY_CODE[c.courseCode];
  return (m && m.name) || c.nameSnapshot || '이름 없는 과목';
}
function courseBadge(c){
  if(c.customName) return '기타';
  var m = CM_BY_CODE[c.courseCode];
  return m ? (CM_BADGE[m.type] || '') : '';
}
function courseArea(c){ var a = CM_AREA[c.area]; return a ? a.name : ''; }
function courseFromMaster(m){
  return {courseCode:m.code, customName:null, nameSnapshot:m.name, area:m.area,
    credits:(m.credits == null ? null : m.credits), hasGrade:m.gradeType === 'rank', isJoint:false};
}

/* ----- 시스템 전환 연출 -----
   지도와 성적 관리가 서로 다른 시스템이라는 것을 느끼게 하려고 일부러 넣은 연출이다.
   빠르게 만들려다 뺀 것이 아니라 의도한 것이므로 지우지 말 것. (SPEC_성적관리시스템.md 0-2)
   길이는 0.5~1.5초 범위. 아래 상수 하나만 고치면 된다. 끄는 옵션은 두지 않는다. */
var TRANSITION_MS = 1000;
var TRANSITION_MIN = 500, TRANSITION_MAX = 1500;
function transitionMs(){ return Math.min(TRANSITION_MAX, Math.max(TRANSITION_MIN, TRANSITION_MS)); }

var gBusy = false;
function gTransition(dir, mid){
  if(gBusy) return;           /* 전환 중에는 입력을 막아 중복 이동을 방지한다. */
  gBusy = true;
  var box = $('#gxLoad'), msg = $('#gxLoadMsg');
  msg.textContent = (dir === 'toGrades') ? '성적 관리로 이동 중…' : '지도로 돌아가는 중…';
  box.hidden = false;
  var fade = reduceMotion ? 0 : 220;
  requestAnimationFrame(function(){ box.classList.add('on'); });
  setTimeout(function(){
    try{ mid(); }finally{
      box.classList.remove('on');
      setTimeout(function(){ box.hidden = true; gBusy = false; }, fade);
    }
  }, transitionMs());
}

/* ----- 저장하지 않은 입력 지키기 -----
   성적 입력은 저장 버튼을 눌러야 반영된다. 저장 없이 화면을 떠나려 하면 먼저 물어본다. */
function leaveGuard(go){
  if(!gs.dirty){ go(); return; }
  gModal({
    title: '저장하지 않은 입력이 있어요',
    body: '<p>지금 나가면 방금 넣은 값이 사라져요.</p>',
    buttons: [
      {label:'저장하고 나가기', main:true, run:function(){ saveDraft(); gModalClose(); gToast('저장했어요'); go(); }},
      {label:'그냥 나가기', run:function(){ gs.dirty = false; gModalClose(); go(); }},
      {label:'취소', run:gModalClose}
    ]
  });
}

var gToastT = 0;

  if(!el){
    el = document.createElement('div');
    el.id = 'gxToast'; el.className = 'gx-toast'; el.setAttribute('aria-live', 'polite');

/* 탭마다 화면 묶음이 따로 있다. 마이 탭은 시험 일정 화면까지 합쳐서 쓴다. */
function gScreens(){
  if(gs.tab === 'score') return SCORE_SCREENS;
  if(gs.tab === 'analysis') return ANALYSIS_SCREENS;
  var m = {};
  for(var k in MY_SCREENS) m[k] = MY_SCREENS[k];
  for(var j in EXAM_SCREENS) m[j] = EXAM_SCREENS[j];
  for(var k2 in TARGET_SCREENS) m[k2] = TARGET_SCREENS[k2];
  return m;
}
function gSetTab(tab){
  if(gs.tab === tab) return;
  gs.tab = tab;
  gs.screen = 'home';
  document.querySelectorAll('.gv-tabs button[data-gtab]').forEach(function(b){
    b.setAttribute('aria-selected', b.getAttribute('data-gtab') === tab ? 'true' : 'false');
  });
  gRender();
}
function gRender(){
  if(!gvEl) return;
  var defs = gScreens(), def = defs[gs.screen];
  if(!def){ gs.screen = 'home'; def = defs.home; }
  var title = typeof def.title === 'function' ? def.title() : def.title;
  var sub = $('#gvSub');
  /* 첫 실행의 학년·학기 화면은 되돌아갈 곳이 없으므로 뒤로가기를 숨긴다. */
  if(def.parent == null || (gs.screen === 'term' && !hasProfile())){
    sub.hidden = true;
  }else{
    sub.hidden = false;
    $('#gvCrumb').textContent = title;
  }
  var body = $('#gvBody');
  body.innerHTML = def.render();
  body.scrollTop = 0;
}
function gGo(screen){ gs.screen = screen; gRender(); }
function gBack(){
  var defs = gScreens(), def = defs[gs.screen];
  /* 교과 선택은 '그 외'를 펼친 상태에서 한 단계 되돌린다. */
  if(gs.screen === 'areas' && gs.group === 'etc'){ gs.group = 'main'; gRender(); return; }
  if(!def || def.parent == null) return;
  if(gs.screen === 'pick'){ gs.group = (CM_AREA[gs.area] || {}).group || 'main'; }
  gGo(def.parent);
}

function gEnter(){
  /* 처음 들어오면 학년·학기부터 받는다. (SPEC 2-0) */
  gs.tab = 'my';
  gs.screen = hasProfile() ? 'home' : 'term';
  gs.sem = null; gs.area = null; gs.group = 'main'; gs.edit = null;
  document.querySelectorAll('.gv-tabs button[data-gtab]').forEach(function(b){
    b.setAttribute('aria-selected', b.getAttribute('data-gtab') === 'my' ? 'true' : 'false');
  });

  gTransition('toGrades', gEnter);
}
function gExit(toView){
  gTransition('toMap', function(){
    gvEl.hidden = true;
    /* 지도는 맨 처음 들어왔을 때의 화면으로 되돌린다. 저장한 자료는 그대로 둔다. */
    var changed = resetMapView();
    if(toView) setView(toView);
    var b = $('#gradesBtn'); if(b) b.focus();
    if(changed && !toView) gToast('내 성적이 반영됐어요');

/* ----- 학기 전환 확인 (SPEC 2-0) ----- */
function checkTermChange(){
  var p = user.profile;
  if(p.currentGrade === 'grad') return;
  var exp = expectedTerm(new Date());
  var expIdx = termIndex(exp.schoolYear, exp.term);
  var curIdx = termIndex(p.schoolYear, p.currentTerm);
  if(expIdx <= curIdx) return;
  if(p.dismissedTermIndex === expIdx) return;
  var next = advanceTerm(p.currentGrade, p.currentTerm, expIdx - curIdx);
  gModal({
    title: '학기가 바뀌었나요?',
    body: '<p>지금 저장된 건 <b>' + esc(gradeTermLabel(p.currentGrade, p.currentTerm)) + '</b>이에요.' +
      ' 날짜로 보면 <b>' + esc(gradeTermLabel(next.grade, next.term)) + '</b>일 것 같아요.</p>' +
      '<p class="gx-note" style="margin:8px 0 0">학교마다 개학일이 달라서 앱이 마음대로 바꾸지 않아요.' +
      ' 바꿔도 지난 학기 기록은 그대로 남아요.</p>',
    buttons: [
      {label:'바꾸기', main:true, run:function(){
        setProfile(next.grade, next.term);
        gModalClose(); gRender();
        gToast(gradeTermLabel(next.grade, next.term) + '로 바꿨어요');
      }},
      {label:'유지', run:function(){
        p.dismissedTermIndex = expIdx; saveUser(); gModalClose();
      }},
      {label:'직접 선택', run:function(){ gModalClose(); gGo('term'); }}
    ]
  });
}

/* ----- 백업 (SPEC 6장) ----- */
/* 저장은 ISO(UTC)로 하되 화면에는 기기 시간대 날짜를 보여준다. 그냥 자르면 하루가 밀린다. */
function ymd(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function ymdOf(iso){ return iso ? ymd(new Date(iso)) : ''; }
/* 성적을 넣은 뒤 14일이 지나도록 백업이 없으면 알린다. 닫으면 7일 뒤에 다시. (SPEC 6장) */
var BACKUP_ALERT_DAYS = 14, BACKUP_SNOOZE_DAYS = 7;
function daysSince(iso){ return iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : null; }
function backupAlertDue(){
  var b = user.backup;
  if(!b.firstEntryAt) return false;
  var since = daysSince(b.lastBackupAt || b.firstEntryAt);
  if(since == null || since < BACKUP_ALERT_DAYS) return false;
  var snoozed = daysSince(b.dismissedAt);
  return snoozed == null || snoozed >= BACKUP_SNOOZE_DAYS;
}
function backupPayload(){
  return {app:'cutmap', kind:'backup', schema:USER_SCHEMA,
    appVersion:APP_META.appVersion, exportedAt:new Date().toISOString(), user:user};
}
function exportBackup(){
  var txt = JSON.stringify(backupPayload(), null, 1);
  var name = 'cutmap-backup-' + ymd(new Date()).replace(/-/g, '') + '.json';
  var url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  user.backup.lastBackupAt = new Date().toISOString();
  saveUser();
  gToast('백업 파일을 내려받았어요');
}
function importBackupFile(file){
  var r = new FileReader();
  r.onload = function(){
    var data;
    try{ data = JSON.parse(r.result); }catch(e){ gToast('읽을 수 없는 파일이에요'); return; }
    if(!data || data.app !== 'cutmap' || !data.user){ gToast('컷맵 백업 파일이 아니에요'); return; }
    var when = ymdOf(data.exportedAt) || '알 수 없음';
    gModal({
      title: '이 백업으로 덮어쓸까요?',
      body: '<p>백업 시점 <b>' + esc(when) + '</b> · 앱 버전 ' + esc(data.appVersion || '알 수 없음') + '</p>' +
        '<p>지금 기기에 있는 성적·과목·목표가 <b>모두 사라지고</b> 백업 내용으로 바뀌어요. 되돌릴 수 없어요.</p>',
      buttons: [
        {label:'덮어쓰기', main:true, run:function(){
          var u = data.user;
          user.profile = (u.profile && typeof u.profile === 'object') ? u.profile : {};
          user.semesters = Array.isArray(u.semesters) ? u.semesters : [];
          user.exams = Array.isArray(u.exams) ? u.exams : [];
          user.schedule = Array.isArray(u.schedule) ? u.schedule : [];
          user.targets = (u.targets && typeof u.targets === 'object') ? u.targets : {};
          user.backup = (u.backup && typeof u.backup === 'object') ? u.backup : {};
          saveUser(); gModalClose();
          gs.screen = hasProfile() ? 'home' : 'term';
          gRender(); gToast('백업을 불러왔어요');
        }},
        {label:'취소', run:gModalClose}
      ]
    });
  };
  r.readAsText(file);
}

/* ----- 이벤트 ----- */
if(gvEl){
  gvEl.addEventListener('click', function(e){
    if(gBusy) return;
    var t;
    if(e.target.closest('[data-gexit]')){ leaveGuard(function(){ gExit(); }); return; }
    if(e.target.closest('#gvBack')){ leaveGuard(gBack); return; }
    if((t = e.target.closest('[data-gtab]'))){
      var tab = t.getAttribute('data-gtab');
      leaveGuard(function(){ gSetTab(tab); });
      return;
    }
    if(e.target.closest('[data-gdday]')){ showDdayList(); return; }
    if(gs.tab === 'score'){ if(scoreClick(e)) return; }
    if(gs.tab === 'analysis'){ if(analysisClick(e)) return; }
    if(skinClick(e)) return;
    if(targetsClick(e)) return;
    if(examsClick(e)) return;
    myClick(e);
  });
  gvEl.addEventListener('input', function(e){
    if(gs.tab === 'score') scoreInput(e);
  });
  gvEl.addEventListener('change', function(e){
    if(scaleChange(e)) return;          /* 등급 단위 스위치는 어느 탭에서나 같은 값 */
    if(gs.tab === 'score'){ if(scoreChange(e)) return; }
    if(gs.tab === 'analysis'){ if(analysisChange(e)) return; }
    myChange(e);
  });
  gvEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.id === 'gxCustom'){ e.preventDefault(); addCustomCourse(); return; }
    if(targetsKey(e)) return;
    skinKey(e);
  });

  $('#gxModal').addEventListener('click', function(e){
    var b = e.target.closest('[data-gm]');
    if(!b || !gModalOnKey) return;
    var def = gModalOnKey[Number(b.getAttribute('data-gm'))];
    if(def && def.run) def.run();
  });

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape' || gBusy) return;
    if(!$('#gxModal').hidden) return;          /* 확인 대화창은 버튼으로만 닫는다. */
    if(!gvEl.hidden) leaveGuard(gBack);
  });
  /* 탭을 닫거나 새로고침할 때도 저장 안 된 입력을 알린다. */
  window.addEventListener('beforeunload', function(e){
    if(!gs.dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });

  /* 지도 탭바의 '성적 관리'는 지도 탭 전환(setView)을 타면 안 된다.
     기존 핸들러보다 먼저 도는 캡처 단계에서 가로채 전체 화면으로 연다. */
  var viewsNav = document.querySelector('.views');
  if(viewsNav) viewsNav.addEventListener('click', function(e){
    if(!e.target.closest('button[data-view="grades"]')) return;
    e.stopPropagation();
    gOpen();
  }, true);

  var verEl = $('#appVer');
  if(verEl) verEl.textContent = 'v' + APP_META.appVersion;
}

function row(attrs, name, meta, tags, arrow){
  return '<button type="button" class="gx-row" ' + attrs + '><span class="gx-main">' +
    '<span class="gx-name">' + name + (tags || '') + '</span>' +
    (meta ? '<span class="gx-meta">' + meta + '</span>' : '') +
    '</span><span class="gx-arrow">' + (arrow || '›') + '</span></button>';
}
function rowOff(name, why){
  return '<button type="button" class="gx-row" disabled><span class="gx-main">' +
    '<span class="gx-name">' + esc(name) + '</span>' +
    '<span class="gx-meta"><span>' + esc(why) + '</span></span></span></button>';
}

    h += '<div class="gx-alert"><span>성적을 넣은 지 꽤 됐는데 백업이 없어요. 기기를 바꾸면 사라져요.</span>' +
      '<span class="gx-alert-btns"><button type="button" class="btn" data-gnav="backup">백업하기</button>' +
      '<button type="button" class="gdel-x" data-galertoff aria-label="닫기">×</button></span></div>';
  }
  h += '<div class="gx-list">';
  h += row('data-gnav="term"', '내 학년·학기',
    '<span>' + esc(hasProfile() ? gradeTermLabel(p.currentGrade, p.currentTerm) : '아직 안 골랐어요') + '</span>');

/* ----- 내 과목: 한 학기 ----- */
function scSem(){
  var list = semCourses(gs.sem), term = gs.sem.split('-')[1], isG1 = gs.sem.charAt(0) === '1';
  var h = '<p class="gx-warn">과목 목록은 아직 <b>원자료로 검증하지 않은 임시 데이터</b>예요. 과목명·학점·등급 산출 여부가 실제와 다를 수 있어요.</p>';
  h += '<div class="gx-acts"><button type="button" class="btn" data-gadd>+ 과목 추가</button>';
  if(isG1) h += '<button type="button" class="btn" data-gcommon>' + term + '학기 공통과목 불러오기</button>';
  h += '</div>';
  if(!list.length){
    h += '<div class="gx-empty">등록한 과목이 없어요.<br>위 버튼으로 추가하세요.</div>';
    h += '<p class="gx-note">학교마다 편성이 달라서 자동으로 채워 넣지 않아요.</p>';
    return h;
  }
  h += '<div class="gx-list">';
  list.forEach(function(c, i){
    var tags = '', b = courseBadge(c);
    if(b) tags += '<span class="gx-badge">' + esc(b) + '</span>';
    if(!c.hasGrade) tags += '<span class="gx-flag">등급 없음</span>';
    if(c.isJoint) tags += '<span class="gx-flag">공동</span>';
    if(c.credits == null) tags += '<span class="gx-flag">학점 미입력</span>';
    var meta = '<span>' + esc(courseArea(c) || '교과 미지정') + '</span>' +

    if(c.customName) meta += '<span>권장과목 매칭 제외</span>';
    h += row('data-gedit="' + i + '"', esc(courseName(c)), meta, tags);

  h += '</div>';

/* ----- 과목 추가·삭제 ----- */
function addCourse(code){
  var m = CM_BY_CODE[code]; if(!m) return;
  var s = ensureSem(gs.sem);
  for(var i = 0; i < s.courses.length; i++){ if(s.courses[i].courseCode === code) return; }
  s.courses.push(courseFromMaster(m));
  saveUser(); gRender();
}
function addCustomCourse(){
  var el = $('#gxCustom'); if(!el) return;
  var nm = (el.value || '').trim();
  if(!nm){ el.focus(); return; }
  var s = ensureSem(gs.sem);
  s.courses.push({courseCode:null, customName:nm, nameSnapshot:nm, area:gs.area,
    credits:4, hasGrade:true, isJoint:false});
  saveUser(); gRender();
}
/* 공통과목은 이름 끝의 1·2로 학기를 가른다. (SPEC 2-1) */
function addCommonCourses(){
  var term = gs.sem.split('-')[1];
  var s = ensureSem(gs.sem), have = {}, added = 0;
  s.courses.forEach(function(c){ if(c.courseCode) have[c.courseCode] = 1; });
  COURSE_MASTER.courses.forEach(function(m){
    if(m.type !== 'common' || have[m.code]) return;
    if(m.name.slice(-1) !== term) return;
    s.courses.push(courseFromMaster(m));
    added++;
  });
  saveUser(); gRender();
  gToast(added ? added + '개 과목을 추가했어요' : '더 추가할 공통과목이 없어요');
}
function delCourse(){
  var s = findSem(gs.sem); if(!s) return;
  var c = s.courses[gs.edit]; if(!c) return;
  gModal({
    title: '이 과목을 지울까요?',
    body: '<p><b>' + esc(courseName(c)) + '</b>을(를) ' + esc(semLabel(gs.sem)) + '에서 지워요.</p>',
    buttons: [
      {label:'지우기', main:true, run:function(){
        s.courses.splice(gs.edit, 1);
        saveUser(); gModalClose();
        gs.edit = null; gGo('sem');
      }},
      {label:'취소', run:gModalClose}
    ]
  });
}

function myClick(e){
  var t;
  if((t = e.target.closest('[data-gnav]'))){ gGo(t.getAttribute('data-gnav')); return; }
  if((t = e.target.closest('[data-gterm]'))){
    var v = t.getAttribute('data-gterm').split(':');
    var g = v[0] === 'grad' ? 'grad' : Number(v[0]);
    setProfile(g, Number(v[1]));
    gGo('home');
    gToast(gradeTermLabel(g, Number(v[1])) + '로 저장했어요');
    return;
  }
  if((t = e.target.closest('[data-gsem]'))){ gs.sem = t.getAttribute('data-gsem'); gGo('sem'); return; }
  if(e.target.closest('[data-gadd]')){ gs.group = 'main'; gGo('areas'); return; }
  if(e.target.closest('[data-gcommon]')){ addCommonCourses(); return; }
  if((t = e.target.closest('[data-ggroup]'))){ gs.group = t.getAttribute('data-ggroup'); gRender(); return; }
  if((t = e.target.closest('[data-garea]'))){ gs.area = t.getAttribute('data-garea'); gGo('pick'); return; }
  if((t = e.target.closest('[data-gpick]'))){ addCourse(t.getAttribute('data-gpick')); return; }
  if(e.target.closest('[data-gcustom]')){ addCustomCourse(); return; }
  if((t = e.target.closest('[data-gedit]'))){ gs.edit = Number(t.getAttribute('data-gedit')); gGo('edit'); return; }
  if(e.target.closest('[data-gdel]')){ delCourse(); return; }
  if(e.target.closest('[data-gterm-reset]')){
    user.profile.dismissedTermIndex = null; saveUser(); gRender();
    gToast('학기 전환 확인을 다시 켰어요');
    return;
  }
  if(e.target.closest('[data-galertoff]')){
    user.backup.dismissedAt = new Date().toISOString(); saveUser(); gRender(); return;
  }
  if(e.target.closest('[data-gexport]')){ exportBackup(); gRender(); return; }
  if(e.target.closest('[data-gimport]')){ var f = $('#gxFile'); if(f) f.click(); return; }
  if(e.target.closest('[data-gresetrun]')){ runReset(); return; }
  if(e.target.closest('[data-gform]')){
    var url = (APP_META.links || {}).feedbackForm;
    if(url) window.open(url, '_blank', 'noopener');
    return;
  }
  if(e.target.closest('[data-ginfo]')){ gExit('info'); return; }
}

function myChange(e){
  var id = e.target.id, t;
  if(id === 'gxFile'){
    if(e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    e.target.value = '';
    return;
  }
  if((t = e.target.closest('[data-gscope]'))){
    var k = t.getAttribute('data-gscope');
    gs.resetScope[k] = t.checked;
    gRender();
    return;
  }
  if(id === 'rsAck'){ gs.resetAck = e.target.checked; gRender(); return; }
  if(gs.screen !== 'edit') return;
  var c = semCourses(gs.sem)[gs.edit]; if(!c) return;
  if(id === 'gxCredits'){
    var raw = e.target.value.trim();
    if(raw === ''){ c.credits = null; }
    else{
      var v = Math.round(Number(raw));
      if(!(v >= 1 && v <= 8)) v = (c.credits == null ? 4 : c.credits);
      c.credits = v; e.target.value = v;
    }
    saveUser(); return;
  }
  if(id === 'gxHasGrade'){ c.hasGrade = e.target.checked; saveUser(); return; }
  if(id === 'gxJoint'){
    c.isJoint = e.target.checked;
    if(c.isJoint && c.hasGrade){
      c.hasGrade = false;
      var g = $('#gxHasGrade'); if(g) g.checked = false;
    }
    saveUser();
  }
}

var PART_LABEL = {midterm:'중간고사', final:'기말고사'};

function todayYmd(){ return ymd(new Date()); }
function daysUntil(dateStr){
  var a = new Date(dateStr + 'T00:00:00'), b = new Date(todayYmd() + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function gradeForSchedule(){
  var g = user.profile.currentGrade;
  return g === 'grad' ? 3 : g;      /* 졸업·N수는 고3 일정을 본다. */
}

function scheduleOverride(ref){
  for(var i = 0; i < user.schedule.length; i++){
    var s = user.schedule[i];
    if(s.kind === 'override' && s.ref === ref) return s;
  }
  return null;
}
function schoolExams(){
  return user.schedule.filter(function(s){ return s.kind === 'school'; });
}
function schoolExamLabel(s){
  return semLabel(s.sem) + ' ' + (PART_LABEL[s.part] || s.part);
}

/* 기본 제공 일정(모의고사·수능) 중 내 학년에 해당하는 것. 사용자가 고친 날짜와 숨김을 반영한다. */
function providedExams(){
  var g = gradeForSchedule();
  return (EXAM_SCHEDULE.exams || []).filter(function(e){
    return (e.grades || []).indexOf(g) >= 0;
  }).map(function(e){
    var ov = scheduleOverride(e.id);
    return {id:e.id, name:e.name, date:(ov && ov.date) || e.date, kind:e.kind,
      host:e.host, note:e.note, dday:e.dday !== false, hidden:!!(ov && ov.hidden),
      moved:!!(ov && ov.date && ov.date !== e.date), origDate:e.date};
  });
}
/* 입시 일정은 학년과 무관하게 보여준다. (사용자 결정) */
function admissionItems(){
  var a = EXAM_SCHEDULE.admission_2029 || {};
  return (a.items || []).map(function(it){
    return {id:'adm-' + (it.date || it.date_start), name:it.name,
      date:it.date || it.date_start, kind:'admission', note:it.note, dday:true, hidden:false};
  });
}

/* D-day 후보: 내가 넣은 학교 시험 + 기본 제공 모의고사 + 입시 일정. 지난 것은 뺀다. */
function ddayList(){
  var out = [];
  schoolExams().forEach(function(s){
    out.push({id:s.id, name:schoolExamLabel(s), date:s.date, kind:'school', dday:true});
  });
  providedExams().forEach(function(e){ if(!e.hidden && e.dday) out.push(e); });
  admissionItems().forEach(function(e){ out.push(e); });
  return out.filter(function(e){ return e.date && daysUntil(e.date) >= 0; })
    .sort(function(a, b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
}

function renderDday(){
  var el = $('#gvDday'); if(!el) return;
  var list = ddayList();
  if(!list.length){
    el.innerHTML = '<span class="gd-none">다가오는 시험이 없어요. 마이 탭에서 학교 시험을 넣어보세요.</span>';
    el.disabled = true;
    return;
  }
  el.disabled = false;
  var n = list[0], d = daysUntil(n.date);
  el.innerHTML = '<span class="gd-num">' + (d === 0 ? 'D-DAY' : 'D-' + d) + '</span>' +
    '<span class="gd-name">' + esc(n.name) + '</span>' +
    '<span class="gd-date">' + esc(n.date) + '</span>' +
    '<span class="gd-more">전체 일정 ›</span>';
}
function showDdayList(){
  var list = ddayList();
  var h = list.map(function(e){
    var d = daysUntil(e.date);
    return '<div class="gd-row"><span>' + esc(e.name) + '</span>' +
      '<span>' + esc(e.date) + ' · ' + (d === 0 ? '오늘' : 'D-' + d) + '</span></div>';
  }).join('');
  gModal({
    title: '다가오는 일정',
    body: (h || '<p>남은 일정이 없어요.</p>') +
      '<p class="gx-note">학력평가 일정은 시행 전에 바뀔 수 있어요. 학교 공지를 확인하세요.</p>',

}

function setOverride(ref, patch){

/* ---------- 성적 관리 · 성적 입력 탭 ---------- */

/* 5등급 상대평가 누적 비율. (SPEC 3-3) */
var CUM5 = [10, 34, 66, 90, 100];
function grade5From(pct){
  for(var i = 0; i < CUM5.length; i++){ if(pct <= CUM5[i]) return i + 1; }
  return 5;
}
/* 동점자가 있으면 중간석차로 계산한다. 학교 처리와 다를 수 있어 사용자가 등급을 고칠 수 있게 해둔다. */
function calcGrade5(rank, tied, count){
  var r = Number(rank), n = Number(count), t = Math.max(1, Number(tied) || 1);
  if(!(n > 0) || !(r > 0) || r > n) return null;
  var eff = r + (t - 1) / 2;
  return grade5From(eff / n * 100);
}

var EXAM_TYPE_LABEL = {midterm:'중간고사', final:'기말고사', semesterConfirmed:'학기말 확정', mock:'모의고사'};
/* 모의고사 영역은 학년·연도에 따라 달라서 고정하지 않는다. 기본 줄만 주고 사용자가 고친다. */
var MOCK_AREAS_DEFAULT = ['국어', '수학', '영어', '한국사', '탐구'];

function examKey(type, sem, refId){
  return type === 'mock' ? ('mock:' + refId) : ('sem:' + sem + ':' + type);
}
function findExam(key){
  for(var i = 0; i < user.exams.length; i++){ if(user.exams[i].id === key) return user.exams[i]; }
  return null;
}
function ensureExam(key, base){
  var e = findExam(key);
  if(!e){
    e = {id:key, type:base.type, sem:base.sem || null, refId:base.refId || null,
      name:base.name, date:base.date || null, studentCount:null, results:[]};
    user.exams.push(e);
  }
  if(!Array.isArray(e.results)) e.results = [];
  return e;
}
function examResult(e, key){
  for(var i = 0; i < e.results.length; i++){
    if(e.results[i].courseCode === key || e.results[i].area === key) return e.results[i];
  }
  return null;
}
function markFirstEntry(){
  if(!user.backup.firstEntryAt) user.backup.firstEntryAt = new Date().toISOString();
}

/* ----- 시험 목록 순서 (A-3-2) -----
   기본 순서: 3모, 1학기 중간, 5모, 6모, 1학기 기말, 7모, 1학기 학기말,
             9모, 2학기 중간, 10모, 2학기 기말, 2학기 학기말, 수능. 학년마다 반복한다.
   날짜가 있는 시험은 날짜순으로 다시 놓고, 날짜가 없는 시험은 기본 자리를 지킨다. */
var SLOT_ORDER = [
  {kind:'mock', month:3},
  {kind:'exam', term:1, part:'midterm'},
  {kind:'mock', month:5},
  {kind:'mock', month:6},
  {kind:'exam', term:1, part:'final'},
  {kind:'mock', month:7},
  {kind:'exam', term:1, part:'semesterConfirmed'},
  {kind:'mock', month:9},
  {kind:'exam', term:2, part:'midterm'},
  {kind:'mock', month:10},
  {kind:'exam', term:2, part:'final'},
  {kind:'exam', term:2, part:'semesterConfirmed'},
  {kind:'csat'}
];
var PART_RANK = {midterm:0, final:1, semesterConfirmed:2};

function gradesWithCourses(){
  var set = {};
  SEM_IDS.forEach(function(id){ if(semCourses(id).length) set[id.charAt(0)] = 1; });
  var cur = user.profile.currentGrade;
  if(cur && cur !== 'grad') set[String(cur)] = 1;
  return Object.keys(set).sort();
}
/* 이미 본 모의고사만. 숨긴 것과 아직 안 본 것은 뺀다. 파일에 없는 시험은 만들지 않는다. */
function pastMocks(){
  return providedExams().filter(function(e){
    return !e.hidden && e.date && daysUntil(e.date) <= 0 && e.kind !== 'result';
  });
}
function examCandidates(){
  var mocks = pastMocks(), used = {}, items = [], base = 0;
  var curGrade = String(user.profile.currentGrade || '');

  gradesWithCourses().forEach(function(g){
    SLOT_ORDER.forEach(function(slot){
      if(slot.kind === 'exam'){
        var sem = g + '-' + slot.term;
        if(!semCourses(sem).length) return;
        var sch = schoolExams().filter(function(s){ return s.sem === sem && s.part === slot.part; })[0];
        items.push({key:examKey(slot.part, sem), type:slot.part, sem:sem, grade:g,
          name:semLabel(sem) + ' ' + EXAM_TYPE_LABEL[slot.part],
          date:(slot.part === 'semesterConfirmed' || !sch) ? null : sch.date,
          base:base++, kindTag:'exam', partRank:PART_RANK[slot.part]});
        return;
      }
      /* 모의고사는 앱 일정 파일에 있는 것만. 지금 학년 자리에만 넣는다. */
      if(g !== curGrade) return;
      var m = null;
      mocks.forEach(function(x){
        if(used[x.id]) return;
        if(slot.kind === 'csat'){ if(x.kind === 'csat') m = m || x; return; }
        if(x.kind === 'csat') return;
        if(Number(x.date.slice(5, 7)) === slot.month) m = m || x;
      });
      if(!m) return;
      used[m.id] = 1;
      items.push({key:examKey('mock', null, m.id), type:'mock', refId:m.id, grade:g,
        name:m.name, date:m.date, base:base++, kindTag:'mock'});
    });
  });
  /* 기본 순서에 자리가 없는 모의고사는 날짜순으로 맨 뒤에 붙인다. */
  mocks.filter(function(x){ return !used[x.id]; })
    .sort(function(a, b){ return a.date < b.date ? -1 : 1; })
    .forEach(function(m){
      items.push({key:examKey('mock', null, m.id), type:'mock', refId:m.id, grade:curGrade,
        name:m.name, date:m.date, base:1000 + base++, kindTag:'mock', tail:true});
    });

  return orderExams(items);
}
/* 날짜 없는 시험은 기본 순서에서 바로 앞 시험의 날짜를 물려받는다. 앞이 없으면 뒤 시험 날짜의 하루 전.
   그 뒤 (날짜, 기본순서)로 정렬하고, 같은 학기 안에서는 중간·기말·학기말 확정 순서를 강제한다. */
function orderExams(items){
  var n = items.length, key = new Array(n);
  for(var i = 0; i < n; i++) key[i] = items[i].date || null;
  for(i = 0; i < n; i++){
    if(key[i]) continue;
    for(var a = i - 1; a >= 0; a--){ if(key[a]){ key[i] = key[a]; break; } }
  }
  for(i = n - 1; i >= 0; i--){
    if(key[i]) continue;
    for(var b = i + 1; b < n; b++){
      if(key[b]){ var d = new Date(key[b] + 'T00:00:00'); d.setDate(d.getDate() - 1); key[i] = ymd(d); break; }
    }
  }
  var idx = items.map(function(it, i){ return {it:it, k:key[i] || '', i:i}; });
  idx.sort(function(x, y){
    if(x.k !== y.k) return x.k < y.k ? -1 : 1;
    return x.it.base - y.it.base;
  });
  var out = idx.map(function(x){ return x.it; });
  /* 같은 학기의 중간 → 기말 → 학기말 확정 순서를 지킨다. */
  for(var pass = 0; pass < 3; pass++){
    var moved = false;
    for(i = 0; i < out.length - 1; i++){
      var p = out[i], q = out[i + 1];
      if(p.sem && p.sem === q.sem && p.partRank > q.partRank){
        out[i] = q; out[i + 1] = p; moved = true;
      }
    }
    if(!moved) break;
  }
  return out;
}

/* ----- 입력 중에는 저장하지 않고 초안(draft)에 담는다. 저장 버튼을 눌러야 반영된다. ----- */
function loadDraft(meta){
  var e = ensureExam(meta.key, meta);
  var d = {key:meta.key, studentCount:e.studentCount, results:{}};
  e.results.forEach(function(r){
    if(!r.courseCode) return;
    d.results[r.courseCode] = {rank:r.rank, tiedCount:r.tiedCount, studentCount:r.studentCount,
      manual:r.gradeManual ? r.grade5 : null, original:r.gradeOriginal};
  });
  gs.draft = d;
  gs.dirty = false;
}
function draftRow(code){
  var d = gs.draft;
  if(!d.results[code]) d.results[code] = {rank:null, tiedCount:null, studentCount:null, manual:null};
  return d.results[code];
}
function draftCount(code){
  var d = gs.draft, r = d.results[code];
  return (r && r.studentCount != null) ? r.studentCount : d.studentCount;
}
function draftGrade(code){
  var r = draftRow(code), calc = calcGrade5(r.rank, r.tiedCount, draftCount(code));
  return r.manual != null ? {g:r.manual, manual:true, calc:calc} : {g:calc, manual:false, calc:calc};
}
function saveDraft(){
  var d = gs.draft, e = ensureExam(gs.examMeta.key, gs.examMeta);
  e.studentCount = d.studentCount;
  Object.keys(d.results).forEach(function(code){
    var src = d.results[code];
    var r = examResult(e, code);
    if(!r){ r = {courseCode:code}; e.results.push(r); }
    var calc = calcGrade5(src.rank, src.tiedCount, src.studentCount != null ? src.studentCount : d.studentCount);
    r.rank = src.rank; r.tiedCount = src.tiedCount; r.studentCount = src.studentCount;
    if(src.manual != null){ r.gradeManual = true; r.gradeOriginal = calc; r.grade5 = src.manual; }
    else { r.gradeManual = false; r.gradeOriginal = null; r.grade5 = calc; }
  });
  markFirstEntry();
  saveUser();
  gs.dirty = false;
}

/* ===== grades/40_analysis.js ===== */
/* ---------- 성적 관리 · 성적 분석 탭 ---------- */

/* 등수와 수강자 수가 있으면 상위 %로 바로 환산해서 오차를 줄인다.
   없으면 5등급 구간 기대값(G5_TO_G9)을 쓴다. 두 경우 모두 추정치다. */
function resultTo9(r, exam){
  var n = r.studentCount || (exam && exam.studentCount), rank = r.rank;
  if(!r.gradeManual && n > 0 && rank > 0 && rank <= n){
    var t = Math.max(1, Number(r.tiedCount) || 1);
    return {v:g9From((rank + (t - 1) / 2) / n * 100), exact:true};
  }
  if(r.grade5 != null) return {v:G5_TO_G9[r.grade5], exact:false};
  return null;
}

var CORE_AREAS = {korean:1, math:1, english:1, social:1, history:1, science:1};

function courseOf(semId, code){
  var list = semCourses(semId);
  for(var i = 0; i < list.length; i++){ if(list[i].courseCode === code) return list[i]; }
  return null;
}
function examsOfType(types){
  return user.exams.filter(function(e){ return types.indexOf(e.type) >= 0; });
}
/* 학점 가중평균. to9가 true면 9등급 환산값, false면 5등급 값 그대로 평균한다. */
function weighted(exams, coreOnly, to9){
  var sum = 0, w = 0, exact = 0, all = 0, noCredit = 0;
  exams.forEach(function(e){
    e.results.forEach(function(r){
      if(!r.courseCode) return;
      var c = courseOf(e.sem, r.courseCode);
      if(!c || !c.hasGrade) return;
      if(coreOnly && !CORE_AREAS[c.area]) return;
      var v, ex = false;
      if(to9){ var g = resultTo9(r, e); if(!g) return; v = g.v; ex = g.exact; }
      else { if(r.grade5 == null) return; v = r.grade5; }
      all++;
      if(c.credits == null){ noCredit++; return; }
      sum += v * c.credits; w += c.credits;
      if(ex) exact++;
    });
  });
  return w > 0 ? {g:Math.round(sum / w * 100) / 100, n:all, exact:exact, noCredit:noCredit} : null;
}
/* 대표 등급 G(9등급). 지도 분류에 쓰는 값이라 스위치와 무관하게 항상 9등급으로 낸다. */
function computeG(coreOnly){
  var c = weighted(examsOfType(['semesterConfirmed']), coreOnly, true);
  if(c){ c.source = 'confirmed'; return c; }
  var p = weighted(examsOfType(['final', 'midterm']), coreOnly, true);
  if(p){ p.source = 'predicted'; return p; }
  return null;
}
/* 스위치를 껐을 때 보여줄 5등급 가중평균. 9등급을 되돌린 값이 아니라 원래 5등급 값으로 계산한다. */
function computeG5(coreOnly){
  var c = weighted(examsOfType(['semesterConfirmed']), coreOnly, false);
  if(c){ c.source = 'confirmed'; return c; }
  var p = weighted(examsOfType(['final', 'midterm']), coreOnly, false);
  if(p){ p.source = 'predicted'; return p; }
  return null;
}
/* 학기별 평균. to9에 따라 축이 달라진다. */
function semAverages(to9){
  var rows = [];
  SEM_IDS.forEach(function(id){
    var conf = user.exams.filter(function(e){ return e.sem === id && e.type === 'semesterConfirmed'; });
    var pred = user.exams.filter(function(e){ return e.sem === id && (e.type === 'final' || e.type === 'midterm'); });
    var use = conf.length ? conf : pred;
    if(!use.length) return;
    var r = weighted(use, false, to9);
    if(r) rows.push({id:id, g:r.g, confirmed:conf.length > 0});
  });
  return rows;
}

function bar(g, max){
  var pct = Math.max(4, Math.min(100, (1 - (g - 1) / (max - 1)) * 100));
  return '<span class="an-bar"><i style="width:' + pct.toFixed(0) + '%"></i></span>';
}

/* ----- 그래프 (인라인 SVG) -----
   등급은 숫자가 작을수록 좋아서 위쪽이 1등급이다. 색은 전부 테마 토큰으로만 칠한다.
   모의고사는 9등급이라 내신 그래프에 섞지 않는다. */
var AG = {w:320, h:180, l:30, r:10, t:12, b:24};
function agX(i, n){
  if(n <= 1) return AG.l + (AG.w - AG.l - AG.r) / 2;
  return AG.l + (AG.w - AG.l - AG.r) * i / (n - 1);
}
function agY(v){
  var max = axisMax();
  return AG.t + (AG.h - AG.t - AG.b) * (v - 1) / (max - 1);
}
function agFrame(labels){
  var max = axisMax(), h = '';
  var ticks = max === 9 ? [1,3,5,7,9] : [1,2,3,4,5];
  ticks.forEach(function(v){
    var y = agY(v).toFixed(1);
    h += '<line class="ag-grid" x1="' + AG.l + '" y1="' + y + '" x2="' + (AG.w - AG.r) + '" y2="' + y + '"/>';
    h += '<text class="ag-label" x="' + (AG.l - 6) + '" y="' + (Number(y) + 3.5).toFixed(1) + '" text-anchor="end">' + v + '</text>';
  });
  labels.forEach(function(t, i){
    h += '<text class="ag-label" x="' + agX(i, labels.length).toFixed(1) + '" y="' + (AG.h - 6) + '" text-anchor="middle">' + esc(t) + '</text>';
  });
  return h;
}
function agSeries(vals, cls){
  var n = vals.length, h = '';
  if(n > 1){
    var pts = vals.map(function(v, i){ return agX(i, n).toFixed(1) + ',' + agY(v.g).toFixed(1); }).join(' ');
    h += '<polyline class="ag-line ' + cls + '" points="' + pts + '"/>';
  }
  vals.forEach(function(v, i){
    var x = agX(i, n).toFixed(1), y = agY(v.g).toFixed(1);
    /* 확정은 채운 동그라미, 예상은 속 빈 네모로 구분한다. */
    if(v.confirmed === false){
      h += '<rect class="ag-dot pred ' + cls + '" x="' + (x - 3.2) + '" y="' + (y - 3.2) + '" width="6.4" height="6.4"/>';
    }else{
      h += '<circle class="ag-dot ' + cls + '" cx="' + x + '" cy="' + y + '" r="3.4"/>';
    }
  });
  return h;
}
function agSvg(inner){
  return '<svg class="ag" viewBox="0 0 ' + AG.w + ' ' + AG.h + '" role="img" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';
}
function anaGraph(){
  var rows = semAverages(isG9());
  var h = '<h3 class="gx-h">학기 평균과 누적 평균</h3>';
  if(!rows.length){

    var labels = rows.map(function(r){ return r.id; });

    h += '<div class="ag-leg"><span class="ag-key s1"></span>학기 평균<span class="ag-key s2"></span>누적 평균' +
      '<span class="ag-key pred"></span>예상값</div>';
    if(rows.length === 1) h += '<p class="gx-note">학기가 하나뿐이라 점 하나만 찍혀요. 학기가 늘면 선으로 이어져요.</p>';
  }

  h += '<h3 class="gx-h">과목별 추이</h3>';
  var byCode = subjectSeries(), codes = Object.keys(byCode);
  if(!codes.length){
    h += '<div class="gx-empty">아직 넣은 지필고사 성적이 없어요.</div>';
    return h;
  }
  var cur = gs.anaCourse && byCode[gs.anaCourse] ? gs.anaCourse : codes[0];
  h += '<div class="an-pick">' + codes.map(function(code){

      esc(c ? courseName(c) : code) + '</button>';
  }).join('') + '</div>';
  var series = byCode[cur].map(function(x){

    return {g:v, confirmed: x.e.type === 'semesterConfirmed', name:x.e.name};
  }).filter(function(x){ return x.g != null; });
  if(!series.length){

  h += '<p class="gx-note">가로축은 시험 순서예요: ' + esc(series.map(function(s, i){ return (i + 1) + '. ' + s.name; }).join(' / ')) + '</p>';
  if(series.length === 1) h += '<p class="gx-note">시험이 하나뿐이라 점 하나만 찍혀요.</p>';
  h += '<p class="gx-note">세로축은 ' + scaleUnit() + '이고 위쪽이 1등급이에요. 모의고사는 9등급이라 이 그래프에 넣지 않았어요.</p>';
  return h;
}

/* ===== grades/45_scale.js ===== */
/* ---------- 등급 표시 단위 (9등급 환산 켜기/끄기) ----------
   판정(상향·적정·안정)은 언제나 9등급 값으로 계산한다. 여기서 바꾸는 건 화면에 보이는 숫자뿐이다.
   그래서 스위치를 켜고 꺼도 마커 색과 분류 결과는 같다.
   저장은 화면 테마와 같은 방식(별도 키, 백업·초기화 대상 아님). */

var SCALE_KEY = 'cutmap.scale';
function scaleMode(){
  var v = store.get(SCALE_KEY, null);
  return v === 'g5' ? 'g5' : 'g9';      /* 모르는 값이면 기본 '9등급 환산' */
}
function isG9(){ return scaleMode() === 'g9'; }
function setScale(m){
  store.set(SCALE_KEY, m === 'g5' ? 'g5' : 'g9');
}
function scaleUnit(){ return isG9() ? '9등급 환산' : '5등급 기준'; }

/* 5등급 -> 9등급 기대값. 균등분포 가정의 [추정]값이며 SPEC 4장과 같은 표다. */
var G5_TO_G9 = {1:1.60, 2:3.42, 3:5.00, 4:6.58, 5:8.40};
var G5_ANCHOR = [[1, 1.60], [2, 3.42], [3, 5.00], [4, 6.58], [5, 8.40]];

/* 9등급 -> 5등급 역환산. 위 표를 기준점으로 구간 선형 보간한다.
   표 바깥은 1.00과 5.00으로 자른다. 왕복 오차는 스크립트로 확인했다. */
function g9to5(v9){
  if(v9 == null || !isFinite(v9)) return null;
  if(v9 <= G5_ANCHOR[0][1]) return 1;
  var last = G5_ANCHOR[G5_ANCHOR.length - 1];
  if(v9 >= last[1]) return 5;
  for(var i = 0; i < G5_ANCHOR.length - 1; i++){
    var a = G5_ANCHOR[i], b = G5_ANCHOR[i + 1];
    if(v9 >= a[1] && v9 <= b[1]){
      var t = (v9 - a[1]) / (b[1] - a[1]);
      return Math.min(5, Math.max(1, a[0] + t * (b[0] - a[0])));
    }
  }
  return null;
}
function g5to9(v5){
  if(v5 == null || !isFinite(v5)) return null;
  if(v5 <= 1) return G5_ANCHOR[0][1];
  if(v5 >= 5) return G5_ANCHOR[4][1];
  for(var i = 0; i < G5_ANCHOR.length - 1; i++){
    var a = G5_ANCHOR[i], b = G5_ANCHOR[i + 1];
    if(v5 >= a[0] && v5 <= b[0]){
      var t = (v5 - a[0]) / (b[0] - a[0]);
      return a[1] + t * (b[1] - a[1]);
    }
  }
  return null;
}

/* 화면에 쓰는 값. 내부 계산은 항상 9등급이고 여기서만 바꾼다. */
function showGrade(v9, digits){
  if(v9 == null || !isFinite(v9)) return '–';
  var d = digits == null ? 2 : digits;
  return (isG9() ? v9 : g9to5(v9)).toFixed(d);
}
/* 차이(±)는 등급 차라서 같은 축으로 바꿔서 보여준다. */
function showDiff(d9, base9){
  if(d9 == null || !isFinite(d9)) return '–';
  if(isG9()) return (d9 > 0 ? '+' : '') + d9.toFixed(2);
  var a = g9to5(base9), b = g9to5(base9 + d9);
  if(a == null || b == null) return '–';
  var d5 = b - a;
  return (d5 > 0 ? '+' : '') + d5.toFixed(2);
}
function scaleNote(){
  return isG9()
    ? '9등급 환산은 5등급 구간을 9등급 척도로 바꾼 추정치예요. 공식 환산표가 아니에요.'
    : '입결은 9등급 자료라서 5등급으로 되돌려 보여줘요. 되돌린 값은 근사값이라 실제와 다를 수 있어요.';
}
function scaleSwitchHtml(id){
  return '<label class="sc-scale"><input type="checkbox" data-scale id="' + (id || 'scScale') + '"' +
    (isG9() ? ' checked' : '') + '><span>9등급 환산으로 보기</span></label>';
}
/* 스위치는 설정·성적 분석·지도 "내 기준" 패널 세 곳에 있고 같은 값을 쓴다. */
function toggleScale(on){
  setScale(on ? 'g9' : 'g5');
  updateMe();
  refreshMarkers();
  if(state.view === 'rank') renderRank();
  if(state.sheetMode === 'grade') openSheet(renderGrade(), 'grade');
  else if(state.sheetMode === 'dept' && state.curDept) openSheet(renderDept(state.curDept, state.curTab), 'dept');
  renderInfo();
  if(!gvEl.hidden) gRender();
}
function scaleClick(e){
  return false;
}
function scaleChange(e){
  if(!e.target.hasAttribute || !e.target.hasAttribute('data-scale')) return false;
  toggleScale(e.target.checked);
  return true;
}

/* ---------- 성적 관리 · 화면 테마 ----------
   테마는 html의 data-skin 속성으로만 바뀐다. 색 값은 skins.css에만 있고 여기에는 두지 않는다.
   저장은 cutmap.user와 분리된 cutmap.skin 키를 쓴다. 백업과 초기화 범위에는 넣지 않는다. */

var SKIN_KEY = 'cutmap.skin';
/* 화면에 놓이는 순서 그대로. 1줄 기본·고양이, 2줄 펭귄·벚꽃, 3줄 방안지·모노, 4줄 우주·황혼. */
var SKINS = [
  {id:'default',  name:'기본',      os:true},
  {id:'cat',      name:'고양이'},
  {id:'penguin',  name:'펭귄'},
  {id:'sakura',   name:'벚꽃'},
  {id:'grid',     name:'방안지'},
  {id:'mono',     name:'모노 잉크'},
  {id:'space',    name:'우주'},
  {id:'dusk',     name:'황혼'}
];
function skinById(id){
  for(var i = 0; i < SKINS.length; i++){ if(SKINS[i].id === id) return SKINS[i]; }
  return null;
}
/* 저장값이 손상됐거나 모르는 값이면 기본으로 본다. */
function currentSkin(){
  var v = store.get(SKIN_KEY, null);
  return (typeof v === 'string' && skinById(v)) ? v : 'default';
}
function applySkin(id){
  var s = skinById(id) ? id : 'default';
  if(s === 'default') document.documentElement.removeAttribute('data-skin');
  else document.documentElement.setAttribute('data-skin', s);
  store.set(SKIN_KEY, s);
}
function skinName(id){ var s = skinById(id); return s ? s.name : '기본'; }
/* 저장값이 손상됐으면 head 스크립트가 남겼을 수 있는 속성까지 정리한다. */
applySkin(currentSkin());

/* 미리보기 축소판. 8개 카드가 같은 마크업을 쓰고, 색은 카드에 붙은 data-skin 토큰으로만 정해진다. */
function skinPreview(id){
  var attr = id === 'default' ? ' class="sk-prev sk-prev-default"' : ' class="sk-prev" data-skin="' + id + '"';
  return '<span' + attr + ' aria-hidden="true">' +
    '<span class="sk-land sk-l1"></span><span class="sk-land sk-l2"></span><span class="sk-land sk-l3"></span>' +
    '<span class="sk-dot sk-d1"></span><span class="sk-dot sk-d2"></span><span class="sk-dot sk-d3"></span>' +
    '<span class="sk-sheet"><span class="sk-bar"></span><span class="sk-line"></span><span class="sk-line s"></span></span>' +
    '</span>';
}

function scSkin(){
  var cur = currentSkin();
  var h = '<p class="gx-lead">화면 색을 고를 수 있어요. 고르면 바로 바뀌어요.</p>';
  h += '<div class="sk-grid" role="radiogroup" aria-label="화면 테마">';
  SKINS.forEach(function(s){
    var on = s.id === cur;
    h += '<button type="button" class="sk-card" role="radio" aria-checked="' + (on ? 'true' : 'false') +
      '" tabindex="' + (on ? '0' : '-1') + '" data-skin-pick="' + s.id + '">' +
      skinPreview(s.id) +
      '<span class="sk-foot"><span class="sk-nm">' + esc(s.name) + '</span>' +
      (s.os ? '<span class="sk-os">OS 설정 따름</span>' : '') +
      '<span class="sk-chk"></span></span></button>';
  });
  h += '</div>';
  h += '<p class="gx-note">기본은 기기의 밝게·어둡게 설정을 따라가요. 나머지는 고른 색으로 고정돼요.</p>';
  return h;
}

function skinClick(e){
  var t = e.target.closest('[data-skin-pick]');
  if(!t) return false;
  applySkin(t.getAttribute('data-skin-pick'));
  gRender();
  gToast(skinName(currentSkin()) + ' 테마로 바꿨어요');
  return true;
}
/* 라디오 묶음이라 좌우·상하 키로 옮길 수 있게 한다. */
function skinKey(e){
  if(gs.screen !== 'skin') return false;
  var keys = {ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1};
  var d = keys[e.key];
  if(!d) return false;
  var cards = Array.prototype.slice.call(document.querySelectorAll('[data-skin-pick]'));
  var i = cards.indexOf(document.activeElement);
  if(i < 0) return false;
  e.preventDefault();
  var next = cards[(i + d + cards.length) % cards.length];
  next.focus(); next.click();
  return true;
}

function loadCatalog(then){
  if(CAT_STATE === 'ready'){ then && then(); return; }
  if(CAT_STATE === 'loading') return;
  CAT_STATE = 'loading';
  gRender();
  fetch('catalog.json').then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(j){
    CATALOG = j; CAT_STATE = 'ready';
    then && then();
    gRender();
  }).catch(function(){
    CAT_STATE = 'error';
    gRender();
  });
}

/* ----- 목표(별표) ----- */
function targets(){
  if(!user.targets || typeof user.targets !== 'object') user.targets = {};
  if(!Array.isArray(user.targets.univIds)) user.targets.univIds = [];
  if(!Array.isArray(user.targets.majorIds)) user.targets.majorIds = [];
  if(!Array.isArray(user.targets.admissionTypes)) user.targets.admissionTypes = [];
  return user.targets;
}
function majorId(univ, name){ return univ + '|' + name; }
function isStarUniv(name){ return targets().univIds.indexOf(name) >= 0; }
function isStarMajor(id){ return targets().majorIds.indexOf(id) >= 0; }
function toggleStarUniv(name){
  var t = targets(), i = t.univIds.indexOf(name);
  if(i >= 0) t.univIds.splice(i, 1); else t.univIds.push(name);
  saveUser();
  refreshMarkers();
  if(state.view === 'rank') renderRank();
}
function toggleStarMajor(id){
  var t = targets(), i = t.majorIds.indexOf(id);
  if(i >= 0) t.majorIds.splice(i, 1); else t.majorIds.push(id);
  saveUser();
  if(state.view === 'rank') renderRank();
}
/* 목록 탭 분야 기본값에 쓸 내 희망 학과의 계열. (SPEC 3-2) */
function targetSeries(){
  if(CAT_STATE !== 'ready') return [];
  var want = {}, out = [];
  targets().majorIds.forEach(function(id){ want[id] = 1; });
  CATALOG.depts.forEach(function(d){
    if(want[majorId(d.univ, d.name)] && out.indexOf(d.series) < 0) out.push(d.series);
  });
  return out;
}

/* ----- 검색 (SPEC 5-3) -----
   학과명에 글자가 없어도 별칭·주요교과목·관련직업으로 걸린다.
   결과마다 왜 나왔는지 적는다. 순서는 학과명 > 별칭 > 교과목·직업. */
function expandQuery(q){
  var words = [q], syn = SYNONYMS || {};
  var key = q.replace(/\s+/g, '');
  ['major', 'univ'].forEach(function(g){
    var m = syn[g] || {};
    Object.keys(m).forEach(function(k){
      if(k.toUpperCase() === key.toUpperCase()) m[k].forEach(function(w){ if(words.indexOf(w) < 0) words.push(w); });
    });
  });
  return words;
}
function searchCatalog(q){
  if(CAT_STATE !== 'ready' || !q) return [];
  var words = expandQuery(q), first = words[0], alias = words.slice(1), out = [], seen = {};
  /* 짧은 줄임말을 그대로 찾으면 엉뚱하게 걸린다("의대"가 "한의대학교"에 맞는 식).
     별칭이 있는 줄임말은 별칭을 먼저 쓰고, 글자 그대로의 매칭은 3글자 이상일 때만 본다. */
  var literalOk = first.length >= 3 || !alias.length;
  CATALOG.depts.forEach(function(d){
    var why = null, rank = 99, i, hit;
    if(literalOk && d.name.indexOf(first) >= 0){ rank = 0; }
    if(rank === 99){
      for(i = 0; i < alias.length; i++){
        if(d.name.indexOf(alias[i]) >= 0){ why = '"' + q + '"과 관련: ' + alias[i]; rank = 1; break; }
      }
    }
    if(rank === 99 && literalOk && d.univ.indexOf(first) >= 0){ why = '대학 이름'; rank = 2; }
    if(rank === 99){
      for(i = 0; i < alias.length; i++){
        if(d.univ.indexOf(alias[i]) >= 0){ why = '대학 이름: ' + alias[i]; rank = 3; break; }
      }
    }
    if(rank === 99){
      hit = d.subjects.filter(function(s){ return words.some(function(w){ return s.indexOf(w) >= 0; }); })[0];
      if(hit){ why = '주요교과목: ' + hit; rank = 4; }
    }
    if(rank === 99){
      hit = d.jobs.filter(function(s){ return words.some(function(w){ return s.indexOf(w) >= 0; }); })[0];
      if(hit){ why = '관련직업: ' + hit; rank = 5; }
    }
    if(rank === 99) return;
    var id = majorId(d.univ, d.name);
    if(seen[id]) return;
    seen[id] = 1;
    out.push({d:d, why:why, rank:rank});
  });
  out.sort(function(a, b){
    if(a.rank !== b.rank) return a.rank - b.rank;
    if(a.d.univ !== b.d.univ) return a.d.univ < b.d.univ ? -1 : 1;
    return a.d.name < b.d.name ? -1 : 1;
  });
  return out.slice(0, 120);
}

        h += '<div class="gx-row" style="cursor:default"><span class="gx-main">' +
          '<span class="gx-name">' + esc(p[1] || id) + '</span>' +
          '<span class="gx-meta"><span>' + esc(p[0] || '') + '</span></span></span>' +
          '<button type="button" class="gdel-x" data-unstar-m="' + esc(id) + '" aria-label="목표에서 빼기">×</button></div>';
      });
      h += '</div>';
    }
  }
  h += '<p class="gx-note">전부 선택 사항이에요. 목표를 안 골라도 앱은 그대로 동작해요.</p>';
  return h;
}

function scTargetSearch(){
  if(CAT_STATE === 'idle'){ loadCatalog(); }
  if(CAT_STATE === 'loading') return '<div class="gx-empty">전국 학과 목록을 불러오는 중이에요…</div>';
  if(CAT_STATE === 'error'){
    return '<div class="gx-empty">학과 목록 파일(catalog.json)을 불러오지 못했어요.<br>' +
      'it-major-map.html과 같은 폴더에 두고 웹서버로 열어야 해요.</div>';
  }
  var q = gs.tq || '';
  var h = '<div class="gx-add"><input type="text" id="tqInput" value="' + esc(q) + '" placeholder="학과, 대학, 직업으로 찾기 (예: IT, 컴공, 간호)" aria-label="검색어">' +
    '<button type="button" class="btn" data-tsearch>찾기</button></div>';
  h += '<p class="gx-note" style="margin-top:0">학과 이름에 없는 말이어도 관련 있으면 나와요. ' +
    '전국 ' + CATALOG.univs.length + '개 학교, ' + CATALOG.depts.length + '개 학과에서 찾아요.</p>';
  if(CATALOG.incomplete) h += '<p class="gx-warn" style="margin-top:10px">원본 파일이 잘려 있어서 빠진 학교와 학과가 있어요. 기준 연도 ' + CATALOG.baseYear + '.</p>';
  if(!q) return h;

  var res = searchCatalog(q);
  if(!res.length) return h + '<div class="gx-empty">"' + esc(q) + '"에 맞는 학과가 없어요.</div>';
  h += '<div class="gx-list">';
  res.forEach(function(x){
    var d = x.d, id = majorId(d.univ, d.name), on = isStarMajor(id);
    h += '<button type="button" class="gx-row" data-star-m="' + esc(id) + '">' +
      '<span class="gx-main"><span class="gx-name">' + esc(d.name) +
      '<span class="gx-badge">' + esc(d.series) + '</span>' +
      (d.isDivision ? '<span class="gx-flag">학부</span>' : '') + '</span>' +
      '<span class="gx-meta"><span>' + esc(d.univ) + '</span>' +
      (x.why ? '<span>' + esc(x.why) + '</span>' : '') + '</span></span>' +
      '<span class="gx-arrow">' + (on ? '★' : '☆') + '</span></button>';
  });
  h += '</div>';
  h += '<p class="gx-note">별을 누르면 목표에 담겨요. 학교 전체를 목표로 하려면 아래에서 고르세요.</p>';
  var unames = [];
  res.forEach(function(x){ if(unames.indexOf(x.d.univ) < 0) unames.push(x.d.univ); });
  h += '<div class="gx-list">';
  unames.slice(0, 12).forEach(function(n){
    h += '<button type="button" class="gx-row" data-star-u="' + esc(n) + '">' +
      '<span class="gx-main"><span class="gx-name">' + esc(n) + '<span class="gx-badge">대학</span></span></span>' +
      '<span class="gx-arrow">' + (isStarUniv(n) ? '★' : '☆') + '</span></button>';
  });
  h += '</div>';
  return h;
}

function targetsClick(e){
  var t;
  if((t = e.target.closest('[data-atype]'))){
    var id = t.getAttribute('data-atype'), arr = targets().admissionTypes, i = arr.indexOf(id);
    if(i >= 0) arr.splice(i, 1); else arr.push(id);
    saveUser(); gRender();
    return true;
  }
  if((t = e.target.closest('[data-star-m]'))){ toggleStarMajor(t.getAttribute('data-star-m')); gRender(); return true; }
  if((t = e.target.closest('[data-star-u]'))){ toggleStarUniv(t.getAttribute('data-star-u')); gRender(); return true; }
  if((t = e.target.closest('[data-unstar-m]'))){ toggleStarMajor(t.getAttribute('data-unstar-m')); gRender(); return true; }
  if((t = e.target.closest('[data-unstar-u]'))){ toggleStarUniv(t.getAttribute('data-unstar-u')); gRender(); return true; }
  if(e.target.closest('[data-tsearch]')){
    var el = $('#tqInput'); gs.tq = el ? el.value.trim() : '';
    gRender();
    return true;
  }
  if((t = e.target.closest('[data-vtv]'))){ setViewType(t.getAttribute('data-vtv')); gRender(); return true; }
  return false;
}
function targetsKey(e){
  if(e.key === 'Enter' && e.target.id === 'tqInput'){
    e.preventDefault();
    gs.tq = e.target.value.trim();
    gRender();
    return true;
  }
  return false;
}

/* ---------- boot ---------- */
state.G = basisG().g;          /* 지도 기준값은 성적 관리에서 받는다. */
updateMe();
renderInfo();
UNIS.forEach(function(u){ var ev = evalUni(u); u._vis = uniVisible(u, ev); });
initMap();
refreshMarkers();
})();
</script>
</body>
